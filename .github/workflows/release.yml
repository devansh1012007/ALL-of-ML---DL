# The release workflow, adopted from docs/cicd/proposed/release.yml
# (docs/cicd/SPEC.md, section 5.3; procedure in docs/cicd/RELEASING.md) on
# 2026-11-12.
# A tag matching v*.*.* first runs the full CI (the reusable workflow, the
# smoke test included), then builds and publishes the backend image to GHCR
# and attaches the frontend build to a GitHub Release. It deploys nothing:
# deployment is a separate, approved step (docs/cicd/proposed/deploy.yml
# until D1 activation).
# Every action is pinned to a full commit SHA (SEC-11); Dependabot keeps the
# SHAs current.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push the backend image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for this release
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # GHCR requires lower-case image names. Change the owner here if the repository moves.
          images: ghcr.io/devansh1012007/allml-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  frontend:
    name: Build the frontend archive
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Archive
        run: tar -C dist -czf "$RUNNER_TEMP/frontend-${GITHUB_REF_NAME}.tgz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-archive
          path: ${{ runner.temp }}/frontend-${{ github.ref_name }}.tgz

  github-release:
    name: Publish the GitHub Release
    needs: [image, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-archive
          path: release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
