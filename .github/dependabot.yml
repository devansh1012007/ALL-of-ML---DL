# The Dependabot configuration, adopted from docs/cicd/proposed/dependabot.yml
# (docs/cicd/SPEC.md, section 5.2, SEC-1) on 2026-11-12.
# Minor and patch updates are grouped to keep the pull-request count small.
# The scikit-learn<1.10 pin in backend/requirements.txt is intentional: an
# upper bound is a bound, Dependabot does not move past it (SPEC section 3).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
