# Jekyll configuration for GitHub Pages.
#
# Enables GitHub Pages to build this repository with Jekyll when the
# "Deploy from branch" source is selected in repository settings
# (SPEC decision D2, option b).
#
# This is an alternative to the Static HTML workflow in
# `.github/workflows/pages.yml`, which builds and deploys the React SPA
# frontend via GitHub Actions. Choose one Pages source in the repository
# settings; Jekyll and the Actions workflow are not active at the same
# time for the same site.

title: ALL-of-ML-&-DL
description: >-
  A web application for training, comparing and querying machine-learning
  models without writing code.
baseurl: "/ALL-of-ML---DL"
url: "https://devansh1012007.github.io"

theme: jekyll-theme-minimal
markdown: kramdown

# Jekyll only processes files with YAML front matter; plain HTML/CSS/JS
# assets are copied as-is. Exclude non-site files so the build stays fast
# and does not trip over backend code, configs or agent-ops records.
exclude:
  - backend/
  - scripts/
  - docs/cicd/
  - docs/agent-ops/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - CONTRIBUTING.md
  - SECURITY.md
  - AGENTS.md
  - .gitignore
