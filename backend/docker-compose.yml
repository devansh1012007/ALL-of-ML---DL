version: '3.8'

services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    restart: no

  web:
    build: .
    # The schema is owned by the migrations, so they have to run before the
    # application starts. The command overrides the image CMD, which is why the
    # migration is repeated here (see the dockerfile).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload"
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    volumes:
      - .:/code
    restart: no