version: '3.8'

services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    # The migration below runs as soon as the "web" container starts, so the
    # database has to accept connections first. Without the healthcheck the
    # migration races the start of Postgres and the stack stays down.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: no

  web:
    build:
      # The dockerfile of this directory is named "dockerfile", not
      # "Dockerfile". The name is given, so the build does not depend on the
      # docker version: the recent ones find the lower case name on their
      # own, the older ones only look for the capitalised one and fail with
      # "failed to read dockerfile: open Dockerfile: no such file or
      # directory".
      context: .
      dockerfile: dockerfile
    # The schema is owned by the migrations, so they have to run before the
    # application starts. The command overrides the image CMD, which is why the
    # migration is repeated here (see the dockerfile).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload"
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # The development signing key is written next to the code. In the
      # container the code lives in /code, which is the mounted volume, so the
      # key survives a restart of the container.
      - SECRET_KEY_FILE=/code/.secret_key
      # The datasets root is the boundary of what the application can read.
      # The container only has the backend/ directory at /code, so the built-in
      # datasets of the repository and the uploads of the users are mounted
      # inside it: without them the dataset list is empty and the uploads are
      # lost on every redeploy.
      - DATASETS_ROOT=/code
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/code
      # The built-in datasets of the repository (../data is resolved against
      # the directory of this file, which is the backend/ directory).
      - ../data:/code/data
      # The uploads of the users. A named volume keeps them when the container
      # is replaced; a bind mount keeps them on the disk of the host.
      - uploads:/code/uploads
    restart: no

volumes:
  # The uploads of the users: they survive the redeployment of the container.
  uploads: