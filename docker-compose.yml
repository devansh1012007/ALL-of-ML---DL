# The deployment of the whole stack (plan H2): the API, a dedicated worker,
# and the Postgres the production target runs on. The queue lives in the
# database, so the API and the worker are interchangeable processes and a
# second worker is one more service line.
#
#   docker compose up -d
#   docker compose exec api alembic upgrade head
#   docker compose exec api python -m backend.app.admin create-admin <name>
#
# Every variable is documented in .env.example; copy it to .env first.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-allml}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allml}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8010 --proxy-headers --forwarded-allow-ips $${TRUSTED_PROXIES:-172.16.0.0/12}"
    env_file: .env
    environment:
      # The API never trains in this deployment: the worker does (plan B8,
      # option 3). TRAINING_IN_API=0 makes this process enqueue only.
      TRAINING_IN_API: "0"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-allml}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-allml}
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: python -m backend.app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-allml}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-allml}
      # A second worker is a copy of this service with more TRAINING_CONCURRENCY.
      TRAINING_CONCURRENCY: "1"
    depends_on:
      db:
        condition: service_healthy
    # The artifacts and the uploads must land on a volume the API can read:
    # the registry stores paths relative to the datasets root.
    volumes:
      - artifacts:/app/backend/models
      - uploads:/app/uploads

volumes:
  pgdata:
  artifacts:
  uploads:
